<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details — Daniel Casadevall</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--header);
            color: var(--black);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header Navigation */
        .detail-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.2rem 3rem;
            border-bottom: var(--border);
            background: var(--header);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            justify-self: start;
        }

        .header-center {
            justify-self: center;
            text-align: center;
        }

        .header-spacer {
            justify-self: end;
        }

        .detail-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--blue-dark);
            margin-bottom: 2px;
        }

        .detail-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            letter-spacing: 0.05em;
            margin: 0;
            line-height: 1.1;
            color: var(--black);
            word-break: break-word;
        }

        .detail-subtitle {
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            font-size: 1.1rem;
            color: var(--gray);
            margin-top: 4px;
        }

        .project-detail-container {
            max-width: 1550px;
            margin: 0 auto;
            padding: 2rem 2rem 5rem 2rem;
        }

        /* 1. Big Hero Video/Image Section */
        .hero-media-container {
            width: 100%;
            max-width: 1500px;
            margin: 0.5rem auto 3.5rem auto;
            border: var(--border);
            overflow: hidden;
            background: #000;
        }

        .hero-media-container video,
        .hero-media-container img {
            width: 100%;
            max-height: 82vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* 2. Divided Split Layout (Left: Text & Explications, Right: Images) */
        .project-split-layout {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 3.5rem;
            align-items: start;
            max-width: 1500px;
            margin: 0 auto;
        }

        @media (max-width: 950px) {
            .project-split-layout {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
        }

        /* Lateral Column 1: Text & Explications */
        .text-lateral-column {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .content-block {
            background: transparent;
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            padding-bottom: 2rem;
        }

        .content-block:last-child {
            border-bottom: none;
        }

        .block-label {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--blue-dark);
            margin-bottom: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .block-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(0, 0, 0, 0.1);
        }

        /* 4-8 word general description tagline */
        .general-tagline {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: var(--black);
            line-height: 1.45;
            margin-bottom: 1.5rem;
            padding-left: 1.2rem;
            border-left: 4px solid var(--blue-dark);
        }

        /* Text slightly bigger */
        .detail-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--black);
        }

        .detail-text p {
            margin-bottom: 1.2rem;
        }

        .detail-text p:last-child {
            margin-bottom: 0;
        }

        /* Highlighted words using <bl> */
        bl {
            font-weight: 700;
            color: var(--black);
        }

        /* Tech Stack Icons - Bigger */
        .stack-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stack-tag {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid var(--black);
            letter-spacing: 0.05em;
            color: var(--black);
        }

        /* Links row */
        .links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn-ghost-large {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--black);
            border: 1px solid var(--black);
            padding: 10px 20px;
            transition: all 0.2s ease;
            background: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ghost-large:hover {
            background: var(--black);
            color: var(--lwhite);
        }

        /* Lateral Column 2: Images */
        .gallery-lateral-column {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .gallery-item {
            border: var(--border);
            overflow: hidden;
            background: #000;
            cursor: zoom-in;
            width: 100%;
            height: 100%;
            display: flex;
        }

        .gallery-item img,
        .gallery-item video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #detail-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.8rem;
        }

        /* Target item 1, 4, 7, 10, etc. (every 3rd item starting from 1) */
        #detail-gallery>*:nth-child(3n + 1) {
            grid-column: span 2;
        }

        /* Ensures gallery items fill their grid cells properly */
        #detail-gallery>* {
            width: 100%;
            height: 100%;
        }

        /* Footer Navigation Buttons (Previous Project / Next Project) */
        .project-nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 3rem 2rem 1rem 2rem;
            border-top: var(--border);
            margin-top: 5rem;
            background: var(--header);
            max-width: 1500px;
            margin-left: auto;
            margin-right: auto;
        }

        .nav-btn-link {
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--black);
            border: 1px solid var(--black);
            padding: 14px 24px;
            transition: all 0.2s ease;
            background: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 48%;
            width: 100%;
        }

        .nav-btn-link.prev-link {
            justify-content: flex-start;
        }

        .nav-btn-link.next-link {
            justify-content: flex-end;
            margin-left: auto;
        }

        .nav-btn-link:hover {
            background: var(--black);
            color: var(--lwhite);
        }

        .nav-btn-text {
            display: flex;
            flex-direction: column;
        }

        .nav-btn-text .btn-label {
            font-size: 10px;
            opacity: 0.7;
            letter-spacing: 0.15em;
        }

        .nav-btn-text .btn-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            line-height: 1.1;
        }

        /* Lightbox modal */
        .lightbox-content-wrapper {
            cursor: zoom-in;
        }

        .lightbox-content-wrapper.zoomed {
            cursor: grab;
        }

        .lightbox-content-wrapper.zoomed.dragging {
            cursor: grabbing;
        }

        .lightbox-content {
            transition: transform .25s ease;
        }

        .lightbox-hint {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .5);
        }

        @media (max-width: 768px) {
            .detail-header {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.6rem;
                padding: 0.8rem 1rem;
            }

            .header-left {
                align-self: flex-start;
                font-size: 11px;
                padding: 6px 14px;
            }

            .header-center {
                width: 100%;
                text-align: center;
            }

            .header-spacer {
                display: none;
            }

            .detail-title {
                font-size: clamp(1.6rem, 6.5vw, 2.2rem);
                line-height: 1.1;
            }

            .detail-subtitle {
                font-size: 0.9rem;
                margin-top: 2px;
            }

            .project-detail-container {
                padding: 1rem 1rem 3rem 1rem;
            }

            .hero-media-container {
                margin: 0 auto 2rem auto;
            }

            .hero-media-container video,
            .hero-media-container img {
                max-height: 50vh;
            }

            .project-split-layout {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            #detail-gallery {
                grid-template-columns: 1fr;
            }

            #detail-gallery>*:nth-child(3n + 1) {
                grid-column: span 1;
            }

            .project-nav-footer {
                flex-direction: column;
                align-items: stretch;
                padding: 2rem 1rem 1rem 1rem;
                margin-top: 3rem;
            }

            .nav-btn-link {
                max-width: 100%;
                justify-content: center !important;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="detail-header">
        <a href="index.html" class="btn-ghost-large header-left">← Back</a>
        <div class="header-center">
            <div class="detail-eyebrow" id="detail-year"></div>
            <h1 id="detail-title" class="detail-title">Loading...</h1>
            <div class="detail-subtitle" id="detail-subtitle"></div>
        </div>
        <div class="header-spacer"></div>
    </div>

    <!-- Main Container -->
    <div class="project-detail-container">
        <!-- 1. Big Hero Video Section -->
        <div class="hero-media-container" id="detail-hero"></div>

        <!-- 2. Divided Split Layout -->
        <div class="project-split-layout">
            <!-- Left Lateral Column: Description, Explications, Stack, Outcome, Learnings, Links -->
            <div class="text-lateral-column">
                <!-- Overview & Description -->
                <div class="content-block" id="block-desc">
                    <div class="block-label">Project Description</div>
                    <div class="general-tagline" id="detail-tagline"></div>
                    <div class="detail-text" id="detail-desc"></div>
                </div>

                <!-- Tech Stack -->
                <div class="content-block" id="block-stack">
                    <div class="block-label">Tech Stack & Software</div>
                    <div id="detail-stack" class="stack-tags"></div>
                </div>

                <!-- Outcome -->
                <div class="content-block" id="block-outcome">
                    <div class="block-label">Outcome & Impact</div>
                    <div class="detail-text" id="detail-outcome"></div>
                </div>

                <!-- Learnings & Difficulties -->
                <div class="content-block" id="block-learnings">
                    <div class="block-label">Learnings & Challenges</div>
                    <div class="detail-text" id="detail-learnings"></div>
                </div>

                <!-- Links & Repos -->
                <div class="content-block" id="block-links">
                    <div class="block-label">Links & References</div>
                    <div id="detail-links" class="links-row"></div>
                </div>
            </div>

            <!-- Right Lateral Column: Images -->
            <div class="gallery-lateral-column" id="gallery-section">
                <div class="block-label" style="margin-bottom: 0;">Project Media & Screenshots</div>
                <div id="detail-gallery">
                </div>
            </div>
        </div>

        <!-- 3. Footer Navigation (Previous Project / Next Project) -->
        <div class="project-nav-footer">
            <a href="#" id="prev-project-btn" class="nav-btn-link prev-link">
                <span>←</span>
                <div class="nav-btn-text">
                    <span class="btn-label">PREVIOUS PROJECT</span>
                    <span class="btn-title" id="prev-project-title"></span>
                </div>
            </a>
            <a href="#" id="next-project-btn" class="nav-btn-link next-link">
                <div class="nav-btn-text" style="text-align: right;">
                    <span class="btn-label">NEXT PROJECT</span>
                    <span class="btn-title" id="next-project-title"></span>
                </div>
                <span>→</span>
            </a>
        </div>
    </div>

    <!-- Lightbox Zoom Modal -->
    <div id="lightbox-modal" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content-wrapper" id="lightbox-wrapper">
            <img class="lightbox-content" id="lightbox-img" src="" alt="">
        </div>
        <div class="lightbox-hint">Click to zoom · drag to pan · Esc to close</div>
    </div>

    <script src="js/info.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const currentIndex = (typeof PROJECTS !== 'undefined') ? PROJECTS.findIndex(proj => proj.id === projectId) : -1;
        const p = currentIndex !== -1 ? PROJECTS[currentIndex] : null;

        if (p) {
            document.title = p.title + ' — Daniel Casadevall';
            document.getElementById('detail-title').textContent = p.title;
            document.getElementById('detail-subtitle').textContent = p.subtitle || '';
            document.getElementById('detail-year').textContent = p.year || '';

            // 4-8 word General Description Tagline on top of description
            document.getElementById('detail-tagline').innerHTML = p.desc || '';

            // Full Description
            document.getElementById('detail-desc').innerHTML = p.fullDesc || '';

            // Tech Stack
            document.getElementById('detail-stack').innerHTML =
                (p.tags || []).map(t => `<span class="stack-tag">${t}</span>`).join('');

            // Outcome
            document.getElementById('detail-outcome').innerHTML = p.outcome || '';

            // Learnings & Difficulties
            const learningsEl = document.getElementById('detail-learnings');
            if (p.learnings) {
                learningsEl.innerHTML = p.learnings;
            } else {
                learningsEl.innerHTML = `Overcame real-time performance constraints and optimized memory architecture through iterative testing and technical profiling.`;
            }

            // Big Hero Video
            const hero = document.getElementById('detail-hero');
            const gallery = document.getElementById('detail-gallery');

            const videos = p.media ? p.media.filter(m => m.type === 'video') : [];

            // Primary hero media: first video, or first image if no video exists
            const heroMedia = videos.length > 0 ? videos[0] : (p.media && p.media.length > 0 ? p.media[0] : null);

            if (heroMedia) {
                hero.innerHTML = heroMedia.type === 'video'
                    ? `<video src="${heroMedia.src}" controls playsinline autoplay loop muted></video>`
                    : `<img src="${heroMedia.src}" alt="${p.title}">`;
            } else {
                hero.style.display = 'none';
            }

            // Gallery: all remaining media items (displayed on right lateral column)
            const remainingMedia = p.media ? p.media.filter(m => m !== heroMedia) : [];
            if (remainingMedia.length > 0) {
                gallery.innerHTML = remainingMedia.map((m, idx) => {
                    if (m.type === 'video') {
                        return `<div class="gallery-item"><video src="${m.src}" controls muted playsinline loop></video></div>`;
                    }
                    return `<div class="gallery-item clickable"><img src="${m.src}" alt="${p.title} gallery ${idx + 1}"></div>`;
                }).join('');
            } else {
                document.getElementById('gallery-section').style.display = 'none';
            }

            // Links
            const linksEl = document.getElementById('detail-links');
            let linkElements = [];
            if (p.links && p.links.length > 0) {
                p.links.forEach(link => {
                    const label = link.label || (link.github ? 'GitHub' : 'Link');
                    const url = link.url || link.github || '#';
                    linkElements.push(`<a href="${url}" target="_blank" class="btn-ghost-large">${label} ↗</a>`);
                });
            }
            const linkTypes = [
                { key: 'github', label: 'GitHub' },
                { key: 'youtube', label: 'YouTube' },
                { key: 'paper', label: 'Paper' },
                { key: 'vimeo', label: 'Vimeo' },
                { key: 'website', label: 'Website' }
            ];
            linkTypes.forEach(type => {
                if (p[type.key]) {
                    linkElements.push(`<a href="${p[type.key]}" target="_blank" class="btn-ghost-large">${type.label} ↗</a>`);
                }
            });
            linksEl.innerHTML = linkElements.join('');
            if (linkElements.length === 0) {
                document.getElementById('block-links').style.display = 'none';
            }

            // Navigation Footer (Previous / Next Project)
            const prevIndex = (currentIndex - 1 + PROJECTS.length) % PROJECTS.length;
            const nextIndex = (currentIndex + 1) % PROJECTS.length;
            const prevProject = PROJECTS[prevIndex];
            const nextProject = PROJECTS[nextIndex];

            document.getElementById('prev-project-btn').href = `projectinfo.html?id=${prevProject.id}`;
            document.getElementById('prev-project-title').textContent = prevProject.title;
            document.getElementById('next-project-btn').href = `projectinfo.html?id=${nextProject.id}`;
            document.getElementById('next-project-title').textContent = nextProject.title;

            // Lightbox Modal Zoom & Pan
            const lightbox = document.getElementById('lightbox-modal');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxWrapper = document.getElementById('lightbox-wrapper');

            let scale = 1, originX = 0, originY = 0;
            let isDragging = false, startX = 0, startY = 0;

            function resetZoom() {
                scale = 1; originX = 0; originY = 0;
                lightboxImg.style.transform = 'translate(0px,0px) scale(1)';
                lightboxImg.classList.remove('zoomed');
                lightboxWrapper.classList.remove('zoomed');
            }

            function applyTransform() {
                lightboxImg.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
            }

            const mediaImages = [
                ...hero.querySelectorAll('img'),
                ...gallery.querySelectorAll('img')
            ];

            mediaImages.forEach(imgEl => {
                imgEl.style.cursor = 'zoom-in';
                imgEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    lightboxImg.src = imgEl.src;
                    lightboxImg.alt = imgEl.alt;
                    resetZoom();
                    lightbox.classList.add('open');
                    document.body.style.overflow = 'hidden';
                });
            });

            function closeLightbox() {
                lightbox.classList.remove('open');
                resetZoom();
                document.body.style.overflow = '';
            }

            document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
            });

            lightboxWrapper.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isDragging) return;
                if (scale === 1) {
                    scale = 2.2;
                    lightboxImg.classList.add('zoomed');
                    lightboxWrapper.classList.add('zoomed');
                } else {
                    resetZoom();
                }
                applyTransform();
            });

            lightboxWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.15 : -0.15;
                scale = Math.min(4, Math.max(1, scale + delta));
                if (scale === 1) {
                    originX = 0; originY = 0;
                    lightboxImg.classList.remove('zoomed');
                    lightboxWrapper.classList.remove('zoomed');
                } else {
                    lightboxImg.classList.add('zoomed');
                    lightboxWrapper.classList.add('zoomed');
                }
                applyTransform();
            }, { passive: false });

            lightboxWrapper.addEventListener('mousedown', (e) => {
                if (scale === 1) return;
                isDragging = true;
                lightboxWrapper.classList.add('dragging');
                startX = e.clientX - originX;
                startY = e.clientY - originY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                originX = e.clientX - startX;
                originY = e.clientY - startY;
                applyTransform();
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                lightboxWrapper.classList.remove('dragging');
            });

        } else {
            document.getElementById('detail-title').textContent = "Project not found";
            document.getElementById('detail-desc').innerHTML = "<p>Please return to the home page and select a valid project.</p>";
        }
    </script>
</body>

</html>
